name: Build Android Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    name: Compile Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project & Unpack App
        run: |
          flutter create --org com.alijedo --project-name piano_practice_with_ai .
          unzip -o piano_app_flutter_source.zip
          cp -r piano_app_flutter_source/* . 2>/dev/null || true
          sed -i 's/\.delete(pitch)/\.remove(pitch)/g' lib/main.dart
          flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: piano-practice-with-ai-apk
          path: build/app/outputs/flutter-apk/*.apk
